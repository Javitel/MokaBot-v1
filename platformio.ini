; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Settings shared by every board. The BOARD_* build flag of each environment
; selects the display/touch driver in src/devices/.
[env]
framework = arduino
upload_speed = 921600
monitor_speed = 115200
lib_archive = false
; Web pages served by the device, compiled into the firmware (no filesystem
; to flash; OTA updates them together with the code). embed_files (binary)
; rather than embed_txtfiles, which appends a NUL byte to the source files.
; Copies each build's firmware.bin to build/<custom_ota_firmware> and gives
; the code that name (OTA_FIRMWARE_FILE) for OTA downloads.
extra_scripts =
	pre:ota-images.py
; Firmware version (FIRMWARE_VERSION in the code and build/<name>.version for
; OTA): bump it on each release.
custom_firmware_version = 1.0.0
board_build.embed_files =
	data/brew.html
	data/index.html
	data/settings.html
monitor_filters =
	esp32_exception_decoder
	time
	default
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_COMP_CONF_INCLUDE_SIMPLE
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-DBOARD_HAS_PSRAM
	-I src/ui/
	-I src/
lib_deps =
	SPI
	lvgl/lvgl @ 8.4.0
	plerup/EspSoftwareSerial@^8.2.0
	r-downing/AutoPID@^1.0.4
	adafruit/Adafruit BMP280 Library@^2.6.8
	santerilindfors/WiFiProvisioner
	robtillaart/ADS1X15@^0.6.2

[env:WT32-SC01-MOKA]
platform = espressif32
board = esp-wrover-kit
board_build.partitions = min_spiffs.csv
custom_ota_firmware = wt32-sc01.bin
build_flags =
	${env.build_flags}
	-DBOARD_WT32_SC01
	-mfix-esp32-psram-cache-issue
lib_deps =
	${env.lib_deps}
	lovyan03/LovyanGFX
; ES8311 audio driver in lib/ is only for the Waveshare board
lib_ignore =
	es8311

; Waveshare ESP32-S3-Touch-LCD-3.5B: ESP32-S3R8 (8MB octal PSRAM), 16MB quad
; flash, AXS15231B QSPI display. Arduino_GFX 1.6 (the version Waveshare ships)
; needs Arduino-ESP32 core 3.x, which comes from the pioarduino platform.
[env:WAVESHARE-S3-TOUCH-LCD-3_5B-MOKA]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
custom_ota_firmware = waveshare-s3-touch-lcd-3.5b.bin
build_flags =
	${env.build_flags}
	-DBOARD_WAVESHARE_S3_TOUCH_LCD_35B
	; Serial over the native USB-C port
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	${env.lib_deps}
	lovyan03/LovyanGFX
	moononournation/GFX Library for Arduino @ ^1.6.0
