# Builds the Android app (android/) and keeps the APK as a workflow artifact.
name: Android app

on:
  push:
    paths:
      - "android/**"
      - "mobile/**"
      - "data/brew.html"
      - "data/settings.html"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "mobile/**"
      - "data/brew.html"
      - "data/settings.html"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mokabot-app
          path: android/app/build/outputs/apk/debug/*.apk
