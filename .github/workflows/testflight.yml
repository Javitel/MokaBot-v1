# Signed iPhone/iPad build uploaded to TestFlight (App Store Connect).
# Runs on each release tag "v*" and by hand (Actions > TestFlight > Run
# workflow). Needs, in the repository settings (Secrets and variables >
# Actions):
#  - variable IOS_BUNDLE_ID: the app's bundle ID, as registered on
#    developer.apple.com and used by the app in App Store Connect;
#  - secrets APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (an App
#    Store Connect API key with the Admin role: Xcode creates the distribution
#    certificate and provisioning profile with it, nothing is stored here).
# Version: custom_firmware_version (platformio.ini); build number: this
# workflow's run number, which only grows, as App Store Connect requires.
name: TestFlight

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # On a release tag, nothing is uploaded when the iOS app did not change since
  # the previous release; a run by hand always uploads.
  changes:
    runs-on: ubuntu-latest
    outputs:
      previous: ${{ steps.check.outputs.previous }}
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/app-changes.sh

  testflight:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ios == 'true'
    # The newest macOS image: it carries the newest Xcode (see "Select the
    # newest Xcode"). App Store Connect requires a recent iOS SDK.
    runs-on: macos-26
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      # The newest Xcode on the runner. App Store Connect only accepts apps
      # built with a recent SDK: iOS 26 now, iOS 27 (Xcode 27) from April
      # 2027. An older Xcode fails the upload (below the current minimum) or
      # warns (below the next one).
      - name: Select the newest Xcode
        env:
          MIN_XCODE: "26"            # required now
          NEXT_XCODE: "27"           # required from April 2027
        run: |
          ls -d /Applications/Xcode_*.app
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E 'Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode found on this runner"
            exit 1
          fi
          major=$(basename "$xcode" | sed -E 's/^Xcode_([0-9]+).*/\1/')
          if [ "$major" -lt "$MIN_XCODE" ]; then
            echo "::error::Newest Xcode here is $(basename "$xcode"); App Store Connect requires Xcode $MIN_XCODE or newer"
            exit 1
          fi
          if [ "$major" -lt "$NEXT_XCODE" ]; then
            echo "::warning::Building with $(basename "$xcode"); from April 2027 App Store Connect requires Xcode $NEXT_XCODE (iOS $NEXT_XCODE SDK). Use a newer runner image (runs-on) before then."
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Check the settings
        run: |
          missing=""
          [ -n "$BUNDLE_ID" ] || missing="$missing variable:IOS_BUNDLE_ID"
          [ -n "$TEAM_ID" ] || missing="$missing secret:APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing secret:ASC_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing secret:ASC_ISSUER_ID"
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || missing="$missing secret:ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Not set in Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
      - name: API key file
        env:
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      # Archived unsigned: signing here would use an "Apple Development"
      # profile, which Apple only makes for a team with a registered device
      # ("Your team has no devices..."). The export below signs the app for
      # App Store distribution, which needs no device.
      - name: Archive
        run: |
          version=$(sed -n 's/^custom_firmware_version *= *//p' platformio.ini | tr -d '\r')
          xcodebuild -project ios/MokaBot.xcodeproj -scheme MokaBot -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/MokaBot.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MokaBot.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
