<!DOCTYPE HTML>
<html>
<head>
  <title>MokaBot Debug</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body {
      min-width: 310px;
      max-width: 800px;
      margin: 0 auto;
      font-family: Arial, sans-serif;
    }
    h2 {
      font-size: 2.5rem;
      text-align: center;
    }
    .chart-box {
      position: relative;
      height: 400px;
    }
    .line-colors {
      margin: 8px 0;
    }
    .line-colors label {
      margin-right: 12px;
    }
  </style>
</head>
<body>
  <h2>MokaBot</h2>
  <div class="chart-box"><canvas id="chart"></canvas></div>
  <div class="line-colors">
    <label>Temperature line <input type="color" id="tempColor" value="#059e8a"></label>
    <label>Pressure line <input type="color" id="pressureColor" value="#ff7a5c"></label>
  </div>
  <button onclick="document.location='settings'">Go to Settings</button>

  <script>
    var MAX_POINTS = 250;

    var chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        datasets: [
          { label: "Temperature (°C)", data: [], yAxisID: "yTemp", borderColor: "#059e8a", backgroundColor: "#059e8a" },
          { label: "Pressure (bar)", data: [], yAxisID: "yPressure", borderColor: "#ff7a5c", backgroundColor: "#ff7a5c" }
        ]
      },
      options: {
        animation: false,
        maintainAspectRatio: false,
        parsing: false,
        pointRadius: 0,
        borderWidth: 2,
        tension: 0.2,
        interaction: { mode: "index", intersect: false },
        plugins: {
          title: { display: true, text: "Moka Info" },
          tooltip: { callbacks: { title: function (items) { return new Date(items[0].parsed.x).toLocaleTimeString(); } } }
        },
        scales: {
          x: { type: "linear", ticks: { callback: function (v) { return new Date(v).toLocaleTimeString(); } } },
          yTemp: { position: "left", min: 0, max: 120, title: { display: true, text: "Temperature (°C)" } },
          yPressure: { position: "right", min: 0.85, max: 1.8, title: { display: true, text: "Pressure (bar)" }, grid: { drawOnChartArea: false } }
        }
      }
    });

    // ---- Line colours: picked here, saved in this browser (shared by the brew
    // and debug pages). Storage can be unavailable (private mode): then the
    // pickers still work for the current visit.
    var COLOR_KEYS = { tempColor: "mokabot.tempColor", pressureColor: "mokabot.pressureColor" };
    var COLOR_TARGETS = {
      tempColor: { dataset: 0, axis: "yTemp" },
      pressureColor: { dataset: 1, axis: "yPressure" }
    };

    function applyLineColor(pickerId, color) {
      var target = COLOR_TARGETS[pickerId];
      var dataset = chart.data.datasets[target.dataset];
      dataset.borderColor = color;
      dataset.backgroundColor = color;
      chart.options.scales[target.axis].title.color = color;
      chart.update();
    }

    Object.keys(COLOR_KEYS).forEach(function (pickerId) {
      var picker = document.getElementById(pickerId);
      var saved = null;
      try { saved = localStorage.getItem(COLOR_KEYS[pickerId]); } catch (e) {}
      if (saved) picker.value = saved;
      applyLineColor(pickerId, picker.value);
      picker.addEventListener("input", function () {
        applyLineColor(pickerId, picker.value);
        try { localStorage.setItem(COLOR_KEYS[pickerId], picker.value); } catch (e) {}
      });
    });

    function addPoint(dataset, x, y) {
      dataset.data.push({ x: x, y: y });
      if (dataset.data.length > MAX_POINTS) dataset.data.shift();
    }

    function update() {
      fetch("/temperature")
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (d) {
          var now = Date.now();
          if (d.temp !== null && d.temp !== -127) addPoint(chart.data.datasets[0], now, d.temp);
          if (d.pressure !== null) addPoint(chart.data.datasets[1], now, d.pressure);
          chart.update();
        })
        .catch(console.error);
    }

    setInterval(update, 1000);
  </script>
</body>
</html>
