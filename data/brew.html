<!DOCTYPE HTML>
<html>
<head>
  <title>MokaBot</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body {
      min-width: 310px;
      max-width: 800px;
      margin: 0 auto;
      font-family: Arial, sans-serif;
    }
    h2 {
      font-size: 2.5rem;
      text-align: center;
    }
    .chart-box {
      position: relative;
      height: 400px;
    }
    .line-colors {
      margin: 8px 0;
    }
    .line-colors label {
      margin-right: 12px;
    }
  </style>
</head>
<body>
  <h2>MokaBot</h2>
  <div class="chart-box"><canvas id="chart"></canvas></div>
  <div class="line-colors">
    <label>Temperature line <input type="color" id="tempColor" value="#059e8a"></label>
    <label>Pressure line <input type="color" id="pressureColor" value="#ff7a5c"></label>
  </div>
  <button onclick="document.location='settings'">Go to Settings</button>

  <script>
    var BREWING = 2;       // PID extraction: temperature + pressure
    var POLL_ACTIVE_MS = 2000;
    var POLL_IDLE_MS = 5000;

    function formatTime(seconds) {
      var s = Math.floor(seconds);
      var h = Math.floor(s / 3600);
      var m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
      var sec = String(s % 60).padStart(2, "0");
      return h > 0 ? String(h).padStart(2, "0") + ":" + m + ":" + sec : m + ":" + sec;
    }

    var chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        datasets: [
          { label: "Temperature (°C)", data: [], yAxisID: "yTemp", borderColor: "#059e8a", backgroundColor: "#059e8a" },
          { label: "Pressure (bar)", data: [], yAxisID: "yPressure", borderColor: "#ff7a5c", backgroundColor: "#ff7a5c" }
        ]
      },
      options: {
        animation: false,
        maintainAspectRatio: false,
        parsing: false,
        pointRadius: 0,
        borderWidth: 2,
        tension: 0.2,
        interaction: { mode: "index", intersect: false },
        plugins: {
          title: { display: true, text: "Moka Info" },
          tooltip: { callbacks: { title: function (items) { return formatTime(items[0].parsed.x); } } }
        },
        scales: {
          x: { type: "linear", ticks: { callback: formatTime } },
          yTemp: { position: "left", min: 0, max: 120, title: { display: true, text: "Temperature (°C)" } },
          yPressure: { position: "right", min: 0.85, max: 1.8, title: { display: true, text: "Pressure (bar)" }, grid: { drawOnChartArea: false } }
        }
      }
    });

    // ---- Line colours: picked here, saved in this browser (shared by the brew
    // and debug pages). Storage can be unavailable (private mode): then the
    // pickers still work for the current visit.
    var COLOR_KEYS = { tempColor: "mokabot.tempColor", pressureColor: "mokabot.pressureColor" };
    var COLOR_TARGETS = {
      tempColor: { dataset: 0, axis: "yTemp" },
      pressureColor: { dataset: 1, axis: "yPressure" }
    };

    function applyLineColor(pickerId, color) {
      var target = COLOR_TARGETS[pickerId];
      var dataset = chart.data.datasets[target.dataset];
      dataset.borderColor = color;
      dataset.backgroundColor = color;
      chart.options.scales[target.axis].title.color = color;
      chart.update();
    }

    Object.keys(COLOR_KEYS).forEach(function (pickerId) {
      var picker = document.getElementById(pickerId);
      var saved = null;
      try { saved = localStorage.getItem(COLOR_KEYS[pickerId]); } catch (e) {}
      if (saved) picker.value = saved;
      applyLineColor(pickerId, picker.value);
      picker.addEventListener("input", function () {
        applyLineColor(pickerId, picker.value);
        try { localStorage.setItem(COLOR_KEYS[pickerId], picker.value); } catch (e) {}
      });
    });

    // Shows or hides the pressure line and its axis (manual power records
    // temperature only).
    function showPressure(visible) {
      chart.data.datasets[1].hidden = !visible;
      chart.options.scales.yPressure.display = visible;
    }

    // ---- Brew history: the device records every brew (one sample per
    // second). The page loads the whole session once, then asks only for the
    // samples after the last one it has.
    var session = -1;   // session shown on the chart
    var next = 0;       // index of the next sample to request

    function addSamples(samples) {
      samples.forEach(function (s) {
        // s = [seconds, tempC | null, pressureBar | null]
        if (s[1] !== null) chart.data.datasets[0].data.push({ x: s[0], y: s[1] });
        if (s[2] !== null) chart.data.datasets[1].data.push({ x: s[0], y: s[2] });
      });
    }

    function loadHistory() {
      fetch("/brewHistory?session=" + session + "&from=" + next)
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (h) {
          // New brew, first load, or the device restarted (fewer samples than
          // already shown): start the chart over with the samples received.
          if (h.session !== session || h.next < next) {
            chart.data.datasets.forEach(function (dataset) { dataset.data = []; });
            showPressure(h.mode === BREWING);
            session = h.session;
          }
          addSamples(h.samples);
          next = h.next;
          if (h.samples.length) chart.update();
          setTimeout(loadHistory, h.active ? POLL_ACTIVE_MS : POLL_IDLE_MS);
        })
        .catch(function (err) {
          console.error(err);
          setTimeout(loadHistory, POLL_IDLE_MS);
        });
    }

    loadHistory();
  </script>
</body>
</html>
