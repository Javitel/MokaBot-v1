<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <style>
    body {
      min-width: 310px;
    	max-width: 800px;
    	height: 400px;
      margin: 0 auto;
    }
    h2 {
      font-family: Arial;
      font-size: 2.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>MokaBot</h2>
  <div id="chart-temperature" class="container"></div>

<button onclick="document.location='settings'">
Go to Settings
</button>


</body>
<script src="https://code.highcharts.com/modules/exporting.js"></script>
<!-- optional -->
<script src="https://code.highcharts.com/modules/offline-exporting.js"></script>
<script src="https://code.highcharts.com/modules/export-data.js"></script>

<script>
var chartT = new Highcharts.Chart({
  chart:{ renderTo : 'chart-temperature' },
  title: { text: 'Moka Info' },
  series: [{
    name: 'Temperature',
    showInLegend: false,
    data: []
  },{
    name: 'Pressure',
    yAxis: 1,
    showInLegend: false,
    data: []
  }],
  plotOptions: {
    line: { animation: false,
      dataLabels: { enabled: false }
    }
  },
  xAxis: {
    type: 'datetime',
    labels: {
      formatter: function() {
        // 'this.value' is the timestamp in milliseconds
        var totalSeconds = Math.floor(this.value / 1000);
        
        var hours = Math.floor(totalSeconds / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;

        // Pad numbers with leading zeros (e.g., 05 instead of 5)
        var displayMinutes = minutes.toString().padStart(2, '0');
        var displaySeconds = seconds.toString().padStart(2, '0');

        if (hours > 0) {
          var displayHours = hours.toString().padStart(2, '0');
          return `${displayHours}:${displayMinutes}:${displaySeconds}`; // HH:MM:SS
        }

        return `${displayMinutes}:${displaySeconds}`; // MM:SS (for shorter durations)
      }
    }
  },
  yAxis: [{
    min: 0,
    max: 120,
    title: { text: 'Temperature (Celsius)' },
    color: '#059e8a'
    //title: { text: 'Temperature (Fahrenheit)' }
  },
  {
     min: 0.850,
    max: 2.0,
    title: { text: 'Pressure (Bar)' },
    opposite: true,
    color: '#ff9e8a'
  }
],
  credits: { enabled: true }
});
setInterval(function ( ) {
  var xhttp = new XMLHttpRequest();
  xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
      //var x = (new Date()).getTime();
      var response = this.responseText;
          y = parseFloat(response.split("_")[0]);
          y2 = parseFloat(response.split("_")[1]);
          x = parseFloat(response.split("_")[2])*1000;
          console.log(y);
          console.log(y2);
      //console.log(this.responseText);
      if(parseInt(response.split("_")[3]) == 2){
        if(chartT.series[0].data.length > 250) {
          if(!isNaN(parseFloat(response.split("_")[0]))){
            chartT.series[0].addPoint([x, y], true, true, true);
          }
          chartT.series[1].addPoint([x, y2], true, true, true);
        } else {
          if(!isNaN(parseFloat(response.split("_")[0]))){
            chartT.series[0].addPoint([x, y], true, false, true);
          }
          chartT.series[1].addPoint([x, y2], true, false, true);
        }
      }
      else{
        //chartT.series[1].setData([], true);
        //chartT.series[0].setData([], true);
      }
    }
  };
  xhttp.open("GET", "/brewInfo", true);
  xhttp.send();
}, 1000 ) ;
</script>
</html>
