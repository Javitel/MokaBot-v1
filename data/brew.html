<!DOCTYPE HTML>
<html>
<head>
  <title>MokaBot</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body {
      min-width: 310px;
      max-width: 800px;
      margin: 0 auto;
      font-family: Arial, sans-serif;
    }
    h2 {
      font-size: 2.5rem;
      text-align: center;
    }
    .chart-box {
      position: relative;
      height: 400px;
    }
    .line-colors {
      margin: 8px 0;
    }
    .line-colors label {
      margin-right: 12px;
    }
    .slots {
      margin: 8px 0;
    }
    .slots button {
      margin-right: 6px;
    }
    #slotInfo {
      margin-top: 4px;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <h2>MokaBot</h2>
  <div class="chart-box"><canvas id="chart"></canvas></div>
  <div class="line-colors">
    <label>Temperature line <input type="color" id="tempColor" value="#059e8a"></label>
    <label>Pressure line <input type="color" id="pressureColor" value="#ff7a5c"></label>
    <label>Target line <input type="color" id="targetColor" value="#8a8a8a"></label>
  </div>
  <!-- Saves the finished brew on the device (only while the moka is OFF). -->
  <div class="slots">
    Save finished brew:
    <button type="button" class="slot-save" data-slot="A" disabled>Save to A</button>
    <button type="button" class="slot-save" data-slot="B" disabled>Save to B</button>
    <button type="button" class="slot-save" data-slot="C" disabled>Save to C</button>
    <span id="slotStatus" role="status"></span>
    <div id="slotInfo"></div>
  </div>
  <button onclick="document.location='settings'">Go to Settings</button>

  <script>
    var BREWING = 2;       // PID extraction: temperature + pressure
    var POLL_ACTIVE_MS = 2000;
    var POLL_IDLE_MS = 5000;

    function formatTime(seconds) {
      var s = Math.floor(seconds);
      var h = Math.floor(s / 3600);
      var m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
      var sec = String(s % 60).padStart(2, "0");
      return h > 0 ? String(h).padStart(2, "0") + ":" + m + ":" + sec : m + ":" + sec;
    }

    var chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        datasets: [
          { label: "Temperature (°C)", data: [], yAxisID: "yTemp", borderColor: "#059e8a", backgroundColor: "#059e8a" },
          { label: "Pressure (bar)", data: [], yAxisID: "yPressure", borderColor: "#ff7a5c", backgroundColor: "#ff7a5c" },
          // PID setpoint: dashed and stepped (it changes in steps, e.g. bloom -> boil).
          { label: "Target (°C)", data: [], yAxisID: "yTemp", borderColor: "#8a8a8a", backgroundColor: "#8a8a8a", borderDash: [6, 4], stepped: true },
          // Saved brew being replayed from the profile page (see loadProfile):
          // dotted, same colours at half transparency. Hidden otherwise.
          { label: "Profile temperature", data: [], yAxisID: "yTemp", borderDash: [2, 3], hidden: true },
          { label: "Profile pressure", data: [], yAxisID: "yPressure", borderDash: [2, 3], hidden: true },
          { label: "Profile target", data: [], yAxisID: "yTemp", borderDash: [2, 3], stepped: true, hidden: true }
        ]
      },
      options: {
        animation: false,
        maintainAspectRatio: false,
        parsing: false,
        pointRadius: 0,
        borderWidth: 2,
        tension: 0.2,
        interaction: { mode: "index", intersect: false },
        plugins: {
          title: { display: true, text: "Moka Info" },
          tooltip: { callbacks: { title: function (items) { return formatTime(items[0].parsed.x); } } }
        },
        scales: {
          x: { type: "linear", ticks: { callback: formatTime } },
          yTemp: { position: "left", min: 0, max: 120, title: { display: true, text: "Temperature (°C)" } },
          yPressure: { position: "right", min: 0.85, max: 1.8, title: { display: true, text: "Pressure (bar)" }, grid: { drawOnChartArea: false } }
        }
      }
    });

    // ---- Line colours: picked here, saved in this browser (shared by the brew
    // and debug pages). Storage can be unavailable (private mode): then the
    // pickers still work for the current visit.
    var COLOR_KEYS = { tempColor: "mokabot.tempColor", pressureColor: "mokabot.pressureColor", targetColor: "mokabot.targetColor" };
    // profile: the matching profile dataset, drawn at half transparency.
    var COLOR_TARGETS = {
      tempColor: { dataset: 0, profile: 3, axis: "yTemp" },
      pressureColor: { dataset: 1, profile: 4, axis: "yPressure" },
      targetColor: { dataset: 2, profile: 5, axis: null }   // shares the temperature axis
    };
    var HALF_ALPHA = "80";   // appended to #rrggbb

    function applyLineColor(pickerId, color) {
      var target = COLOR_TARGETS[pickerId];
      var dataset = chart.data.datasets[target.dataset];
      dataset.borderColor = color;
      dataset.backgroundColor = color;
      var profile = chart.data.datasets[target.profile];
      profile.borderColor = color + HALF_ALPHA;
      profile.backgroundColor = color + HALF_ALPHA;
      if (target.axis) chart.options.scales[target.axis].title.color = color;
      chart.update();
    }

    Object.keys(COLOR_KEYS).forEach(function (pickerId) {
      var picker = document.getElementById(pickerId);
      var saved = null;
      try { saved = localStorage.getItem(COLOR_KEYS[pickerId]); } catch (e) {}
      if (saved) picker.value = saved;
      applyLineColor(pickerId, picker.value);
      picker.addEventListener("input", function () {
        applyLineColor(pickerId, picker.value);
        try { localStorage.setItem(COLOR_KEYS[pickerId], picker.value); } catch (e) {}
      });
    });

    // Shows or hides the pressure line, its axis and the target line (manual
    // power records temperature only: no pressure and no PID target).
    function showPressure(visible) {
      chart.data.datasets[1].hidden = !visible;
      chart.data.datasets[2].hidden = !visible;
      chart.options.scales.yPressure.display = visible;
    }

    // ---- Replayed profile: when the session replays a saved brew (EXTRACT on
    // the profile page), its recorded curves are drawn under the live ones.
    var profileShown = null;   // slot drawn, null = none

    function setProfileDatasets(samples, slot, brewing) {
      var datasets = chart.data.datasets;
      [3, 4, 5].forEach(function (i) { datasets[i].data = []; });
      (samples || []).forEach(function (s) {
        if (s[1] !== null) datasets[3].data.push({ x: s[0], y: s[1] });
        if (s[2] !== null) datasets[4].data.push({ x: s[0], y: s[2] });
        if (s[3] !== null) datasets[5].data.push({ x: s[0], y: s[3] });
      });
      datasets[3].hidden = !samples;
      // Like the live lines: no pressure or target in manual power.
      datasets[4].hidden = !samples || !brewing;
      datasets[5].hidden = !samples || !brewing;
      if (slot) {
        datasets[3].label = "Profile " + slot + " temperature";
        datasets[4].label = "Profile " + slot + " pressure";
        datasets[5].label = "Profile " + slot + " target";
      }
      chart.update();
    }

    function loadProfile(slot, brewing) {
      if (slot === profileShown) return;
      profileShown = slot;
      if (!slot) {
        setProfileDatasets(null);
        return;
      }
      fetch("/brewSlot?slot=" + slot)
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (p) {
          // Still the profile of the session shown?
          if (profileShown === slot) setProfileDatasets(p.samples, slot, brewing);
        })
        .catch(function (err) {
          console.error(err);
          // Retried on the next poll.
          if (profileShown === slot) profileShown = null;
        });
    }

    // ---- Brew history: the device records every brew (one sample per
    // second). The page loads the whole session once, then asks only for the
    // samples after the last one it has.
    var session = -1;   // session shown on the chart
    var next = 0;       // index of the next sample to request
    var mokaStatus = null;

    function addSamples(samples) {
      samples.forEach(function (s) {
        // s = [seconds, tempC | null, pressureBar | null, targetC | null]
        if (s[1] !== null) chart.data.datasets[0].data.push({ x: s[0], y: s[1] });
        if (s[2] !== null) chart.data.datasets[1].data.push({ x: s[0], y: s[2] });
        if (s.length > 3 && s[3] !== null) chart.data.datasets[2].data.push({ x: s[0], y: s[3] });
      });
    }

    function loadHistory() {
      fetch("/brewHistory?session=" + session + "&from=" + next)
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (h) {
          // New brew, first load, or the device restarted (fewer samples than
          // already shown): start the chart over with the samples received.
          if (h.session !== session || h.next < next) {
            [0, 1, 2].forEach(function (i) { chart.data.datasets[i].data = []; });
            showPressure(h.mode === BREWING);
            session = h.session;
            // Reload the profile too: the slot may have been saved again since.
            profileShown = undefined;
          }
          loadProfile(h.profile || null, h.mode === BREWING);
          addSamples(h.samples);
          next = h.next;
          mokaStatus = h.status;
          updateSlotButtons();
          if (h.samples.length) chart.update();
          setTimeout(loadHistory, h.active ? POLL_ACTIVE_MS : POLL_IDLE_MS);
        })
        .catch(function (err) {
          console.error(err);
          setTimeout(loadHistory, POLL_IDLE_MS);
        });
    }

    // ---- Saved brews (slots A, B, C on the device) ----
    var slots = {};     // what each slot holds, from /brewSlots
    var MODE_NAMES = { 2: "extraction", 3: "manual power" };

    // Saving is only possible once the brew has finished (moka OFF) and there
    // is something recorded.
    function updateSlotButtons() {
      var canSave = mokaStatus === 0 && next > 0;
      document.querySelectorAll(".slot-save").forEach(function (button) {
        button.disabled = !canSave;
      });
    }

    function describeSlot(name) {
      var slot = slots[name];
      if (!slot) return name + ": empty";
      return name + ": " + formatTime(slot.seconds) + " " + (MODE_NAMES[slot.mode] || "brew");
    }

    function loadSlots() {
      fetch("/brewSlots")
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (data) {
          slots = data;
          document.getElementById("slotInfo").textContent =
            ["A", "B", "C"].map(describeSlot).join("  ·  ");
        })
        .catch(console.error);
    }

    document.querySelectorAll(".slot-save").forEach(function (button) {
      button.addEventListener("click", function () {
        var name = button.dataset.slot;
        var status = document.getElementById("slotStatus");
        if (slots[name] && !confirm("Slot " + name + " already holds a brew (" + describeSlot(name) + "). Overwrite it?")) return;
        status.textContent = "Saving...";
        fetch("/brewSave?slot=" + name, { method: "POST" })
          .then(function (r) {
            return r.text().then(function (text) { status.textContent = text; });
          })
          .then(loadSlots)
          .catch(function () { status.textContent = "Save failed (connection error)"; });
      });
    });

    loadSlots();
    loadHistory();
  </script>
</body>
</html>
