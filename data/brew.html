<!DOCTYPE HTML>
<html>
<head>
  <title>MokaBot</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body {
      min-width: 310px;
      max-width: 800px;
      margin: 0 auto;
      font-family: Arial, sans-serif;
    }
    h2 {
      font-size: 2.5rem;
      text-align: center;
    }
    .chart-box {
      position: relative;
      height: 400px;
    }
  </style>
</head>
<body>
  <h2>MokaBot</h2>
  <div class="chart-box"><canvas id="chart"></canvas></div>
  <button onclick="document.location='settings'">Go to Settings</button>

  <script>
    var MAX_POINTS = 250;
    var BREWING = 2;

    function formatTime(seconds) {
      var s = Math.floor(seconds);
      var h = Math.floor(s / 3600);
      var m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
      var sec = String(s % 60).padStart(2, "0");
      return h > 0 ? String(h).padStart(2, "0") + ":" + m + ":" + sec : m + ":" + sec;
    }

    var chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        datasets: [
          { label: "Temperature (°C)", data: [], yAxisID: "yTemp", borderColor: "#059e8a", backgroundColor: "#059e8a" },
          { label: "Pressure (bar)", data: [], yAxisID: "yPressure", borderColor: "#ff7a5c", backgroundColor: "#ff7a5c" }
        ]
      },
      options: {
        animation: false,
        maintainAspectRatio: false,
        parsing: false,
        pointRadius: 0,
        borderWidth: 2,
        tension: 0.2,
        interaction: { mode: "index", intersect: false },
        plugins: {
          title: { display: true, text: "Moka Info" },
          tooltip: { callbacks: { title: function (items) { return formatTime(items[0].parsed.x); } } }
        },
        scales: {
          x: { type: "linear", ticks: { callback: formatTime } },
          yTemp: { position: "left", min: 0, max: 120, title: { display: true, text: "Temperature (°C)" } },
          yPressure: { position: "right", min: 0.85, max: 1.8, title: { display: true, text: "Pressure (bar)" }, grid: { drawOnChartArea: false } }
        }
      }
    });

    function addPoint(dataset, x, y) {
      dataset.data.push({ x: x, y: y });
      if (dataset.data.length > MAX_POINTS) dataset.data.shift();
    }

    function update() {
      fetch("/brewInfo")
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (d) {
          if (d.status !== BREWING) return;
          if (d.temp !== null && d.temp !== -127) addPoint(chart.data.datasets[0], d.time, d.temp);
          if (d.pressure !== null) addPoint(chart.data.datasets[1], d.time, d.pressure);
          chart.update();
        })
        .catch(console.error);
    }

    setInterval(update, 1000);
  </script>
</body>
</html>
